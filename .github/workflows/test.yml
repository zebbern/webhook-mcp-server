name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run offline tests
        run: pytest -m "not live and not live_auth" -v

  live-auth:
    name: live tests against webhook.site (needs WEBHOOK_SITE_API_KEY secret)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    env:
      WEBHOOK_SITE_API_KEY: ${{ secrets.WEBHOOK_SITE_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run authenticated live tests
        run: |
          if [ -z "$WEBHOOK_SITE_API_KEY" ]; then
            echo "WEBHOOK_SITE_API_KEY secret not configured; skipping live_auth tests"
            exit 0
          fi
          pytest -m live_auth -v
